name: Build CV-1 portable application

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release containing the Vision model ZIP
        type: string
        required: false

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Get source code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install application dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m pip install --upgrade --force-reinstall torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install portable OCR runtime
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          New-Item -ItemType Directory -Force -Path tools/tesseract | Out-Null
          Copy-Item -Path 'C:\Program Files\Tesseract-OCR\*' -Destination tools/tesseract -Recurse -Force
          Invoke-WebRequest -Uri 'https://github.com/tesseract-ocr/tessdata_fast/raw/main/rus.traineddata' -OutFile tools/tesseract/tessdata/rus.traineddata

      - name: Download and verify published classifier
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          gh release download $env:RELEASE_TAG --pattern CV1_Vision_Model.zip
          if ($LASTEXITCODE -ne 0) { throw "Could not download the classifier" }
          Expand-Archive -LiteralPath CV1_Vision_Model.zip -DestinationPath .
          python -c "from app.infrastructure.local_vision import default_model_folder, read_model_card; read_model_card(default_model_folder())"

      - name: Build portable Kern Analyzer
        run: python -m PyInstaller --noconfirm --clean Kern_Analyzer.spec

      - name: Remove incompatible ICU DLLs
        shell: pwsh
        run: |
          Remove-Item -LiteralPath dist/Kern_Analyzer/_internal/icuuc.dll -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath dist/Kern_Analyzer/_internal/icudt78.dll -Force -ErrorAction SilentlyContinue

      - name: Verify packaged executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/Kern_Analyzer/Kern_Analyzer.exe' -ArgumentList '--portable-smoke-test' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Portable smoke test failed with exit code $($process.ExitCode)" }

      - name: Audit package for generative components
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from PyInstaller.archive.readers import CArchiveReader

          package = Path("dist/Kern_Analyzer")
          archive = CArchiveReader(str(package / "Kern_Analyzer.exe"))
          entries = set(archive.toc)
          for name in tuple(entries):
              if name.endswith(".pyz"):
                  entries.update(archive.open_embedded_archive(name).toc)
          entries.update(path.relative_to(package).as_posix() for path in package.rglob("*") if path.is_file())

          blocked = {"transformers", "peft", "accelerate", "llama_cpp", "llama_cpp_python",
                     "bitsandbytes", "local_vlm_runner", "local_llama_runtime"}
          matches = []
          for name in sorted(entries):
              normalized = name.casefold().replace("\\", "/")
              parts = normalized.replace(".", "/").split("/")
              if normalized.endswith((".gguf", ".safetensors")) or any(
                      part.startswith("qwen") or part.split("-", 1)[0] in blocked for part in parts):
                  matches.append(name)
          if matches:
              raise SystemExit("Generative components in portable package: " + ", ".join(matches))
          print(f"Checked {len(entries)} package entries")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Portable package audit failed" }

      - name: Upload portable application
        if: inputs.release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: Kern_Analyzer-Windows
          path: dist/Kern_Analyzer
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified portable application
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Kern_Analyzer/* -DestinationPath Kern_Analyzer-Windows.zip -CompressionLevel Optimal
          $hash = (Get-FileHash Kern_Analyzer-Windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Kern_Analyzer-Windows.zip" | Set-Content Kern_Analyzer-Windows.zip.sha256 -Encoding ascii
          gh release upload $env:RELEASE_TAG Kern_Analyzer-Windows.zip Kern_Analyzer-Windows.zip.sha256 --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the Windows application" }
